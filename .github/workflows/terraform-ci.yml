name: Terraform CI

on:
  push:
  pull_request:

jobs:
  terraform-check:
    name: Terraform Format and Validate
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: latest

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Init
        id: init
        run: terraform init -backend=false

      - name: Terraform Validate
        id: validate
        run: terraform validate

      - name: Check Results
        if: steps.fmt.outcome == 'failure'
        run: |
          echo "::error::Terraform formatting check failed. Please run 'terraform fmt -recursive' locally."
          exit 1

  packer-check:
    name: Packer Format and Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Packer
        uses: hashicorp/setup-packer@main
        id: setup
        with:
          version: latest

      - name: Packer Format Check
        id: fmt
        run: packer fmt -check dify-golden-image.pkr.hcl
        continue-on-error: true

      - name: Packer Init
        id: init
        run: packer init dify-golden-image.pkr.hcl

      - name: Packer Validate
        id: validate
        run: packer validate dify-golden-image.pkr.hcl

      - name: Check Results
        if: steps.fmt.outcome == 'failure'
        run: |
          echo "::error::Packer formatting check failed. Please run 'packer fmt dify-golden-image.pkr.hcl' locally."
          exit 1
